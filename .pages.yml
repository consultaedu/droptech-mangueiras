media:
  - name: arquivos
    label: Arquivos do site
    input: assets/uploads
    output: /assets/uploads
    categories: [image, document]
    rename: safe
settings:
  content:
    merge: true
content:
  - name: empresa
    label: Site / informações gerais
    type: file
    path: conteudo/empresa.json
    format: json
    operations: {delete: false}
    fields:
      - {name: nome, label: Nome da empresa, type: string, required: true}
      - {name: slogan, label: Slogan, type: string}
      - {name: descricao, label: Descrição institucional, type: text}
      - name: slides
        label: Slides da Home
        type: object
        list:
          collapsible: {collapsed: true, summary: "{titulo}"}
        fields:
          - {name: ativo, label: Exibir, type: boolean, default: true}
          - {name: etiqueta, label: Etiqueta, type: string}
          - {name: titulo, label: Título, type: string, required: true}
          - {name: texto, label: Texto, type: text}
          - {name: imagem, label: Imagem, type: image, options: {media: arquivos}}
          - {name: botao, label: Texto do botão, type: string}
          - {name: link, label: Link do botão, type: string}
          - {name: ordem, label: Ordem, type: number, default: 1}
      - name: sobre
        label: Quem somos
        type: object
        fields:
          - {name: titulo, label: Título, type: string}
          - {name: resumo, label: Resumo da Home, type: text}
          - {name: historia, label: História - parágrafo 1, type: text}
          - {name: historia2, label: História - parágrafo 2, type: text}
          - {name: imagem, label: Imagem principal, type: image, options: {media: arquivos}}
          - {name: missao, label: Missão, type: text}
          - {name: visao, label: Visão, type: text}
          - {name: valores, label: Valores, type: string, list: true}
      - name: destaques
        label: Destaques institucionais
        type: object
        list:
          collapsible: {collapsed: true, summary: "{valor}"}
        fields:
          - {name: valor, label: Palavra / destaque, type: string}
          - {name: texto, label: Texto complementar, type: text}
      - name: produtos
        label: Página Produtos
        type: object
        fields:
          - {name: titulo, label: Título, type: string}
          - {name: texto, label: Texto, type: text}
          - {name: imagem, label: Imagem, type: image, options: {media: arquivos}}
      - name: contatoPagina
        label: Página Contato
        type: object
        fields:
          - {name: etiqueta, label: Etiqueta, type: string}
          - {name: titulo, label: Título, type: string}
          - {name: texto, label: Texto, type: text}
          - {name: imagem, label: Imagem, type: image, options: {media: arquivos}}
      - name: contato
        label: Contato
        type: object
        fields:
          - {name: telefone, label: Telefone, type: string}
          - {name: whatsapp, label: WhatsApp com DDI e DDD, type: string, description: "Somente números"}
          - {name: email, label: E-mail, type: string}
          - {name: horario, label: Horário, type: string}
      - name: endereco
        label: Endereço
        type: object
        fields:
          - {name: linha1, label: Endereço / bairro, type: string}
          - {name: cidade, label: Cidade, type: string}
          - {name: estado, label: Estado, type: string}
          - {name: cep, label: CEP, type: string}
          - {name: mapa, label: Link do Google Maps (opcional), type: string, description: "Se deixar vazio, o mapa usa o endereço acima automaticamente."}
      - name: redes
        label: Redes sociais
        type: object
        fields:
          - {name: instagram, label: Instagram, type: string}
          - {name: facebook, label: Facebook, type: string}
          - {name: linkedin, label: LinkedIn, type: string}
          - {name: linktree, label: Linktree, type: string}
  - name: categorias
    label: Categorias
    type: file
    path: conteudo/categorias.json
    format: json
    list: true
    operations: {delete: false}
    fields:
      - {name: ativo, label: Exibir, type: boolean, default: true}
      - {name: slug, label: Identificador, type: string, required: true}
      - {name: nome, label: Nome, type: string, required: true}
      - {name: descricao, label: Descrição, type: text}
      - {name: imagem, label: Imagem, type: image, options: {media: arquivos}}
      - {name: ordem, label: Ordem, type: number, default: 1}
  - name: produtos
    label: Produtos
    type: file
    path: conteudo/produtos.json
    format: json
    list: true
    operations: {delete: false}
    fields:
      - {name: disponivel, label: Exibir no site, type: boolean, default: true}
      - {name: destaque, label: Destaque, type: boolean, default: false}
      - {name: id, label: Identificador / slug, type: string, required: true}
      - {name: nome, label: Nome, type: string, required: true}
      - {name: categoria, label: Slug da categoria, type: string, required: true}
      - {name: categoriaNome, label: Nome da categoria, type: string}
      - {name: resumo, label: Resumo, type: text}
      - {name: descricao, label: Descrição completa, type: text}
      - {name: imagem, label: Foto principal, type: image, options: {media: arquivos}}
      - {name: galeria, label: Fotos adicionais, type: image, list: true, options: {media: arquivos}}
      - {name: aplicacoes, label: Aplicações, type: string, list: true}
      - {name: caracteristicas, label: Características, type: string, list: true}
      - name: fichaTecnica
        label: Ficha técnica
        type: object
        fields:
          - {name: composicao, label: Material / composição, type: string, description: "Ex.: PVC flexível reforçado com trama de poliéster"}
          - {name: pressaoTrabalho, label: Pressão de trabalho, type: string, description: "Ex.: 250 PSI"}
          - {name: temperaturaTrabalho, label: Temperatura de trabalho, type: string, description: "Ex.: 5 °C a 50 °C"}
          - {name: coluna1Titulo, label: Título da coluna 1, type: string, default: "Medida / diâmetro"}
          - {name: coluna2Titulo, label: Título da coluna 2, type: string, default: "Espessura / parede"}
          - {name: coluna3Titulo, label: Título da coluna 3, type: string, default: "Comprimento / rolo"}
          - name: linhas
            label: Linhas da tabela
            type: object
            list:
              collapsible: {collapsed: true, summary: "{valor1} | {valor2} | {valor3}"}
            fields:
              - {name: valor1, label: Coluna 1, type: string}
              - {name: valor2, label: Coluna 2, type: string}
              - {name: valor3, label: Coluna 3, type: string}
          - {name: observacoes, label: Observações técnicas, type: text}
      - {name: ordem, label: Ordem, type: number, default: 1}
  - name: galeria
    label: Galeria / fotos da empresa
    type: file
    path: conteudo/galeria.json
    format: json
    list: true
    operations: {delete: false}
    fields:
      - {name: publicado, label: Exibir, type: boolean, default: true}
      - {name: titulo, label: Título, type: string, required: true}
      - {name: imagem, label: Imagem, type: image, required: true, options: {media: arquivos}}
      - {name: ordem, label: Ordem, type: number, default: 1}
  - name: clientes
    label: Clientes / parceiros
    type: file
    path: conteudo/clientes.json
    format: json
    list: true
    operations: {delete: false}
    fields:
      - {name: ativo, label: Exibir, type: boolean, default: true}
      - {name: nome, label: Nome, type: string, required: true}
      - {name: logo, label: Logo, type: image, required: true, options: {media: arquivos}}
      - {name: link, label: Site / link, type: string}
      - {name: ordem, label: Ordem, type: number, default: 1}
  - name: catalogos
    label: Catálogos
    type: file
    path: conteudo/catalogos.json
    format: json
    list: true
    operations: {delete: false}
    fields:
      - {name: ativo, label: Exibir, type: boolean, default: true}
      - {name: titulo, label: Título, type: string, required: true}
      - {name: descricao, label: Descrição, type: text}
      - {name: capa, label: Capa, type: image, options: {media: arquivos}}
      - name: arquivo
        label: Arquivo PDF
        type: file
        required: true
        options: {media: arquivos, extensions: [pdf]}
      - {name: ordem, label: Ordem, type: number, default: 1}
  - name: certificacoes
    label: Certificações
    type: file
    path: conteudo/certificacoes.json
    format: json
    list: true
    operations: {delete: false}
    fields:
      - {name: ativo, label: Exibir, type: boolean, default: true}
      - {name: nome, label: Nome, type: string, required: true}
      - {name: imagem, label: Selo / imagem, type: image, options: {media: arquivos}}
      - {name: link, label: Link do certificado, type: string}
      - {name: ordem, label: Ordem, type: number, default: 1}
