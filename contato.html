<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"><meta name="description" content="Fale com a equipe DropTech."><title>Contato | DropTech Mangueiras</title></head><body data-page="contato"><div id="siteHeader"></div><main>
<section class="breadcrumb-band"><div class="container"><a href="index.html">Home</a><span>•</span><strong>Contato</strong></div></section>
<section class="section contact-main"><div class="container contact-head-grid"><div class="contact-title reveal"><span class="kicker" id="contactKicker">Contato</span><h1 class="display-title" id="contactPageTitle">Fale conosco e encontre a solução ideal.</h1></div><p class="contact-lead reveal" id="contactPageText"></p></div><div class="container contact-body-grid"><div class="contact-photo reveal"><img id="contactPhoto" src="assets/images/fabrica/fabrica-02.webp" alt="DropTech"><div class="contact-photo-wash"></div></div><div class="contact-form-wrap reveal"><form id="contactForm" class="contact-form"><div class="field full"><label>Nome</label><input name="nome" required placeholder="Seu nome"></div><div class="field"><label>E-mail</label><input name="email" type="email" placeholder="Seu melhor e-mail"></div><div class="field"><label>Telefone</label><input name="telefone" placeholder="(00) 00000-0000"></div><div class="field"><label>Cidade</label><input name="cidade" placeholder="Sua cidade"></div><div class="field"><label>Estado</label><input name="estado" placeholder="UF" maxlength="2"></div><div class="field full"><label>Mensagem</label><textarea name="mensagem" required placeholder="Como podemos ajudar?"></textarea></div><label class="privacy-check"><input type="checkbox" required> <span>Li e concordo com a <a href="politica-privacidade.html">Política de Privacidade</a>.</span></label><button class="form-submit" type="submit">Enviar mensagem <i class="fa-solid fa-arrow-right"></i></button></form></div></div></section>
<section class="contact-info-band"><div class="container contact-cards"><article><i class="fa-solid fa-phone"></i><div><span>Telefone / WhatsApp</span><a id="contactPhoneLink" href="#"><strong id="contactPhone"></strong></a></div></article><article><i class="fa-regular fa-envelope"></i><div><span>E-mail</span><a id="contactEmailLink" href="#"><strong id="contactEmail"></strong></a></div></article><article><i class="fa-solid fa-location-dot"></i><div><span>Onde estamos</span><strong id="contactAddress"></strong></div></article><article><i class="fa-regular fa-clock"></i><div><span>Atendimento</span><strong id="contactHours"></strong></div></article></div></section>
<section class="contact-map-band" id="contactMapSection"><div class="contact-map-wrap"><iframe id="contactMap" title="Localização da DropTech Mangueiras" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><a id="contactMapLink" class="contact-map-link" href="#" target="_blank" rel="noopener"><i class="fa-solid fa-location-arrow"></i><span>Como chegar</span></a></div></section>
</main><div id="siteFooter"></div><script src="assets/js/app.js"></script></body></html>
